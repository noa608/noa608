<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>פינת המשחקים</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1240;--card:#2f1f6b;--ink:#fff7e6;--hot:#ff4f8b;--sun:#ffc93c;--sky:#3cd3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Rubik,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:max(12px,env(safe-area-inset-top)) 12px 24px}
h1{font-size:2.2rem;font-weight:800;margin:8px 0 4px;text-align:center}
.sub{text-align:center;opacity:.8;margin:0 0 18px}
.screen{display:none;max-width:420px;margin:auto}
.screen.on{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:0;border-radius:22px;padding:22px 8px;color:#1c1240;font:800 1.2rem Rubik,sans-serif;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.card span{font-size:3rem}
.card:active,.btn:active{transform:scale(.96)}
.btn{border:0;border-radius:14px;padding:10px 16px;background:var(--sun);color:#1c1240;font:800 1rem Rubik,sans-serif;cursor:pointer}
.back{background:var(--card);color:var(--ink);margin-bottom:10px}
canvas{display:block;width:100%;max-width:360px;margin:auto;border-radius:16px;touch-action:none;background:#120a2e}
.hint{text-align:center;opacity:.8;margin:8px 0}
#room{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--card);padding:14px;border-radius:20px}
#room button{border:0;border-radius:16px;background:#412b8f;color:var(--ink);font:500 .9rem Rubik,sans-serif;padding:14px 4px;cursor:pointer}
#room button span{display:block;font-size:2.4rem}
#msg{min-height:3.2em;background:#120a2e;border-radius:14px;padding:12px;margin:12px 0}
.code{display:flex;gap:8px}
.code input{flex:1;border:2px solid var(--sky);border-radius:12px;background:#120a2e;color:var(--ink);font:800 1.3rem Rubik,sans-serif;text-align:center;letter-spacing:.3em;padding:8px}
#face{display:block;width:100%;max-width:260px;margin:0 auto 10px}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}
.row b{width:60px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff7e6;cursor:pointer;padding:0}
.tools{display:flex;gap:8px;justify-content:center;margin-top:14px}
</style>
</head>
<body>

<section class="screen on" id="home">
  <h1>פינת המשחקים</h1>
  <p class="sub">בחרו משחק ותתחילו לשחק</p>
  <div class="grid">
    <button class="card" style="background:var(--sun)" onclick="go('escape')"><span>🗝️</span>חדר בריחה</button>
    <button class="card" style="background:#7bdc7b" onclick="go('zomb')"><span>🧟</span>זומבים</button>
    <button class="card" style="background:var(--sky)" onclick="go('pong')"><span>🏓</span>פינג פונג</button>
    <button class="card" style="background:var(--hot)" onclick="go('makeup')"><span>💄</span>איפור</button>
  </div>
</section>

<section class="screen" id="pong">
  <button class="btn back" onclick="go('home')">חזרה לתפריט</button>
  <canvas id="c1" width="360" height="560"></canvas>
  <p class="hint">גררו את האצבע כדי להזיז את המחבט. מי שמגיע ל-5 מנצח.</p>
</section>

<section class="screen" id="zomb">
  <button class="btn back" onclick="go('home')">חזרה לתפריט</button>
  <canvas id="c2" width="360" height="560"></canvas>
  <p class="hint">גררו כדי לזוז. הדמות יורה לבד על הזומבי הקרוב.</p>
</section>

<section class="screen" id="escape">
  <button class="btn back" onclick="go('home')">חזרה לתפריט</button>
  <div id="room">
    <button data-i="lamp"><span>💡</span>מנורה</button>
    <button data-i="art"><span>🖼️</span>תמונה</button>
    <button data-i="sofa"><span>🛋️</span>ספה</button>
    <button data-i="box"><span>📦</span>תיבה</button>
    <button data-i="inv"><span>🎒</span>תיק</button>
    <button data-i="door"><span>🚪</span>דלת</button>
  </div>
  <div id="msg">נעלתם בחדר. חפשו רמזים ופתחו את הדלת.</div>
  <div class="code"><input id="code" inputmode="numeric" maxlength="3" placeholder="000"><button class="btn" id="ok">פתח תיבה</button></div>
</section>

<section class="screen" id="makeup">
  <button class="btn back" onclick="go('home')">חזרה לתפריט</button>
  <svg id="face" viewBox="0 0 200 250">
    <path id="hair" d="M30 120C25 40 175 40 170 120L178 230H22Z" fill="#4a2c17"/>
    <rect id="neck" x="82" y="180" width="36" height="50" fill="#f1c9a5"/>
    <ellipse id="face2" cx="100" cy="115" rx="58" ry="75" fill="#f1c9a5"/>
    <circle id="b1" cx="68" cy="140" r="14" fill="#ff8aa5" opacity=".5"/>
    <circle id="b2" cx="132" cy="140" r="14" fill="#ff8aa5" opacity=".5"/>
    <ellipse id="s1" cx="75" cy="98" rx="17" ry="10" fill="#a58cff" opacity=".7"/>
    <ellipse id="s2" cx="125" cy="98" rx="17" ry="10" fill="#a58cff" opacity=".7"/>
    <ellipse cx="75" cy="105" rx="12" ry="7" fill="#fff"/><circle cx="75" cy="105" r="5" fill="#3b2415"/>
    <ellipse cx="125" cy="105" rx="12" ry="7" fill="#fff"/><circle cx="125" cy="105" r="5" fill="#3b2415"/>
    <path d="M60 88Q75 80 90 88M110 88Q125 80 140 88" stroke="#3b2415" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M100 112Q94 135 102 138" stroke="#c9967a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path id="lip" d="M76 162Q100 148 124 162Q100 188 76 162Z" fill="#d6336c"/>
  </svg>
  <div id="sw"></div>
  <div class="tools"><button class="btn" id="rnd">אקראי</button><button class="btn back" id="rst">איפוס</button></div>
</section>

<script>
const $=s=>document.querySelector(s);
let stop=null;
const games={};
function go(id){
  if(stop)stop();stop=null;
  document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id===id));
  if(games[id])stop=games[id]();
  scrollTo(0,0);
}
function loop(f){
  let r,on=1;
  (function l(){if(!on)return;f();r=requestAnimationFrame(l)})();
  return()=>{on=0;cancelAnimationFrame(r)};
}
function pos(c,e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*360,y:(e.clientY-r.top)/r.height*560}}
function msg(x,t,w,h){x.fillStyle='rgba(18,10,46,.85)';x.fillRect(0,h/2-60,w,120);x.fillStyle='#fff7e6';x.textAlign='center';x.font='800 28px Rubik,sans-serif';x.fillText(t,w/2,h/2);x.font='500 16px Rubik,sans-serif';x.fillText('גע במסך כדי לשחק שוב',w/2,h/2+34)}

/* ---------- פינג פונג ---------- */
games.pong=()=>{
  const c=$('#c1'),x=c.getContext('2d'),PW=70;
  let p=145,a=145,s=[0,0],b,done=0;
  const reset=d=>b={x:180,y:280,vx:Math.random()*4-2,vy:d*4};
  reset(1);
  c.onpointermove=c.onpointerdown=e=>{
    p=Math.max(0,Math.min(360-PW,pos(c,e).x-PW/2));
    if(done){done=0;s=[0,0];reset(1)}
  };
  return loop(()=>{
    if(!done){
      a+=(b.x-PW/2-a)*.07;
      b.x+=b.vx;b.y+=b.vy;
      if(b.x<7||b.x>353)b.vx*=-1;
      if(b.vy>0&&b.y>523&&b.y<540&&b.x>p&&b.x<p+PW){b.vy=-Math.min(10,b.vy*1.05);b.vx=(b.x-p-PW/2)/6}
      if(b.vy<0&&b.y<37&&b.y>20&&b.x>a&&b.x<a+PW){b.vy=Math.min(10,-b.vy*1.03);b.vx=(b.x-a-PW/2)/6}
      if(b.y<0){s[0]++;reset(1)}
      if(b.y>560){s[1]++;reset(-1)}
      if(s[0]>=5||s[1]>=5)done=1;
    }
    x.clearRect(0,0,360,560);
    x.setLineDash([10,10]);x.strokeStyle='#412b8f';x.beginPath();x.moveTo(0,280);x.lineTo(360,280);x.stroke();x.setLineDash([]);
    x.fillStyle='#ff4f8b';x.fillRect(a,16,PW,10);
    x.fillStyle='#3cd3ff';x.fillRect(p,534,PW,10);
    x.fillStyle='#ffc93c';x.beginPath();x.arc(b.x,b.y,7,0,7);x.fill();
    x.fillStyle='#fff7e6';x.font='800 24px Rubik,sans-serif';x.textAlign='left';
    x.fillText(s[1],16,262);x.fillText(s[0],16,314);
    if(done)msg(x,s[0]>=5?'ניצחתם! 🎉':'הפסדתם',360,560);
  });
};

/* ---------- זומבים ---------- */
games.zomb=()=>{
  const c=$('#c2'),x=c.getContext('2d');
  let P,T,Z,B,hp,sc,t,over;
  const init=()=>{P={x:180,y:300};T={x:180,y:300};Z=[];B=[];hp=100;sc=0;t=0;over=0};
  init();
  c.onpointermove=c.onpointerdown=e=>{
    T=pos(c,e);
    if(over&&t>40)init();
  };
  const spawn=()=>{
    const s=Math.random()*4|0,r=Math.random();
    Z.push({x:s<2?r*360:s==2?-20:380,y:s==0?-20:s==1?580:r*560,h:2});
  };
  return loop(()=>{
    t++;
    if(!over){
      P.x+=(T.x-P.x)*.12;P.y+=(T.y-P.y)*.12;
      if(t%Math.max(18,60-sc)==0)spawn();
      if(t%14==0&&Z.length){
        let n=Z[0],d=1e9;
        Z.forEach(z=>{const q=Math.hypot(z.x-P.x,z.y-P.y);if(q<d){d=q;n=z}});
        B.push({x:P.x,y:P.y,vx:(n.x-P.x)/(d||1)*9,vy:(n.y-P.y)/(d||1)*9});
      }
      B.forEach(b=>{b.x+=b.vx;b.y+=b.vy});
      B=B.filter(b=>b.x>-10&&b.x<370&&b.y>-10&&b.y<570);
      Z.forEach(z=>{
        const q=Math.hypot(P.x-z.x,P.y-z.y)||1,sp=.7+Math.min(sc,40)/60;
        z.x+=(P.x-z.x)/q*sp;z.y+=(P.y-z.y)/q*sp;
        B.forEach(b=>{if(Math.hypot(b.x-z.x,b.y-z.y)<15){z.h--;b.x=-99}});
        if(q<20)hp-=.4;
      });
      Z=Z.filter(z=>z.h>0||(sc++,0));
      if(hp<=0){over=1;t=0}
    }
    x.fillStyle='#16301f';x.fillRect(0,0,360,560);
    x.textAlign='center';x.font='28px serif';
    Z.forEach(z=>x.fillText('🧟',z.x,z.y+10));
    x.fillText('🦸',P.x,P.y+10);
    x.fillStyle='#ffc93c';
    B.forEach(b=>{x.beginPath();x.arc(b.x,b.y,3.5,0,7);x.fill()});
    x.fillStyle='#412b8f';x.fillRect(12,12,150,10);
    x.fillStyle='#ff4f8b';x.fillRect(12,12,Math.max(0,hp)*1.5,10);
    x.fillStyle='#fff7e6';x.font='800 18px Rubik,sans-serif';x.textAlign='right';
    x.fillText('חיסולים: '+sc,348,24);
    if(over)msg(x,'הזומבים ניצחו',360,560);
  });
};

/* ---------- חדר בריחה ---------- */
games.escape=()=>{
  const st={key:0,box:0},m=$('#msg'),t0=Date.now();
  m.textContent='נעלתם בחדר. חפשו רמזים ופתחו את הדלת.';
  $('#code').value='';
  const say=t=>m.textContent=t;
  const hit={
    lamp:()=>say('מתחת למנורה יש פתק: הספרה הראשונה היא 7.'),
    art:()=>say('מאחורי התמונה כתוב: הספרה האמצעית היא 3.'),
    sofa:()=>say('בין הכריות מצאתם פתק: הספרה האחרונה היא 9.'),
    box:()=>say(st.box?'התיבה פתוחה וריקה.':'התיבה נעולה בקוד של 3 ספרות. הקלידו אותו למטה.'),
    inv:()=>say(st.key?'בתיק יש מפתח 🔑':'התיק ריק.'),
    door:()=>{
      if(st.key)say('הדלת נפתחה! יצאתם אחרי '+Math.round((Date.now()-t0)/1000)+' שניות 🎉');
      else say('הדלת נעולה. צריך מפתח.');
    }
  };
  document.querySelectorAll('#room button').forEach(b=>b.onclick=()=>hit[b.dataset.i]());
  $('#ok').onclick=()=>{
    if(st.box)return say('התיבה כבר פתוחה.');
    if($('#code').value==='739'){st.box=st.key=1;say('התיבה נפתחה! מצאתם מפתח 🔑')}
    else say('הקוד שגוי. נסו שוב.');
  };
  return null;
};

/* ---------- איפור ---------- */
games.makeup=()=>{return null};
const groups=[
  ['שפתון',['#d6336c','#ff6b6b','#8e1b3a','#ff9ec4','#7a1fa2'],['lip']],
  ['צללית',['#a58cff','#3cd3ff','#ffc93c','#ff4f8b','#2e8b57'],['s1','s2']],
  ['סומק',['#ff8aa5','#ff6b4a','#d96ba0','#f4a261'],['b1','b2']],
  ['שיער',['#4a2c17','#111111','#d9a441','#c0392b','#7b4fd6'],['hair']],
  ['עור',['#f9dcc4','#f1c9a5','#d9a37a','#a8704a','#6b4429'],['face2','neck']]
];
const def={lip:'#d6336c',s1:'#a58cff',s2:'#a58cff',b1:'#ff8aa5',b2:'#ff8aa5',hair:'#4a2c17',face2:'#f1c9a5',neck:'#f1c9a5'};
const paint=(ids,col)=>ids.forEach(i=>document.getElementById(i).setAttribute('fill',col));
groups.forEach(([n,cols,ids])=>{
  const r=document.createElement('div');r.className='row';
  r.innerHTML='<b>'+n+'</b>';
  cols.forEach(c=>{
    const b=document.createElement('button');
    b.className='sw';b.style.background=c;b.setAttribute('aria-label',n+' '+c);
    b.onclick=()=>paint(ids,c);r.appendChild(b);
  });
  $('#sw').appendChild(r);
});
$('#rnd').onclick=()=>groups.forEach(([n,cols,ids])=>paint(ids,cols[Math.random()*cols.length|0]));
$('#rst').onclick=()=>Object.keys(def).forEach(i=>paint([i],def[i]));
</script>
</body>
</html>
