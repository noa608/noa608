<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ARCADE</title>
    <style>
        :root {
            --bg: #090d16;
            --surface: #131b2e;
            --accent: #38bdf8;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: var(--bg);
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }
        header {
            width: 100%;
            max-width: 900px;
            padding: 1.2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand {
            font-size: 2.2rem;
            filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.5));
        }
        .hud {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .pill {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.5rem 1.2rem;
            border-radius: 99px;
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .pill:hover {
            border-color: var(--accent);
            transform: scale(1.05);
        }
        .grid {
            width: 100%;
            max-width: 900px;
            padding: 1rem 1.5rem 3rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.2rem;
        }
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .tile {
            aspect-ratio: 1 / 1;
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s;
            border: 2px solid rgba(255,255,255,0.12);
        }
        .tile:hover {
            transform: translateY(-8px) scale(1.04);
            box-shadow: 0 20px 35px rgba(0,0,0,0.6);
            border-color: rgba(255,255,255,0.5);
        }
        .tile:active {
            transform: scale(0.96);
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(9, 13, 22, 0.96);
            backdrop-filter: blur(10px);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal.active {
            display: flex;
        }
        .top-bar {
            width: 100%;
            max-width: 460px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .icon-btn {
            background: var(--surface);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .icon-btn:hover {
            background: #ef4444;
            border-color: #ef4444;
        }
        .icon-btn.restart:hover {
            background: #10b981;
            border-color: #10b981;
        }
        .stage {
            background: var(--surface);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }
        canvas {
            background: #060911;
            border-radius: 16px;
            display: block;
            touch-action: none;
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-6px, 4px); }
            50% { transform: translate(6px, -4px); }
            75% { transform: translate(-4px, -4px); }
        }
        .room {
            width: 360px;
            height: 440px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 75%, #090d16 75%);
            border-radius: 16px;
            position: relative;
            overflow: hidden;
        }
        .room-item {
            position: absolute;
            font-size: 2.8rem;
            cursor: pointer;
            transition: transform 0.2s;
            filter: drop-shadow(0 5px 8px rgba(0,0,0,0.5));
        }
        .room-item:hover {
            transform: scale(1.15);
        }
        .clue-bubble {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #38bdf8;
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 1.5rem;
            display: none;
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        .keypad {
            position: absolute;
            inset: 40px;
            background: rgba(15, 23, 42, 0.98);
            border: 2px solid #f59e0b;
            border-radius: 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            z-index: 20;
        }
        .code-slots {
            display: flex;
            gap: 10px;
        }
        .slot {
            width: 55px;
            height: 65px;
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 12px;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .fashion-wrap {
            width: 360px;
            height: 440px;
            background: linear-gradient(180deg, #3b0764 0%, #1e1b4b 100%);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
        }
        .model-stage {
            width: 220px;
            height: 240px;
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(244, 114, 182, 0.4);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(236, 72, 153, 0.25);
        }
        .fashion-layer {
            font-size: 3.2rem;
            line-height: 1.05;
            transition: transform 0.2s;
        }
        .fashion-controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
        }
        .f-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            height: 64px;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s;
        }
        .f-btn:active {
            transform: scale(0.9);
            background: #ec4899;
        }
    </style>
</head>
<body>

<header>
    <div class="brand">🕹️</div>
    <div class="hud">
        <div class="pill" id="soundBtn" onclick="toggleSound()">🔊</div>
        <div class="pill">🏆 <span id="scoreVal">0</span></div>
    </div>
</header>

<div class="grid" id="lobby"></div>

<div class="modal" id="modal">
    <div class="top-bar">
        <div class="pill">⭐ <span id="gameScore">0</span></div>
        <div style="display:flex; gap:10px;">
            <button class="icon-btn restart" onclick="restartCurrent()">🔄</button>
            <button class="icon-btn" onclick="closeModal()">✕</button>
        </div>
    </div>
    <div class="stage" id="stage"></div>
</div>

<script>
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let actx = null;
let soundOn = true;

function playTone(freq, type = 'sine', dur = 0.1, vol = 0.1) {
    if (!soundOn) return;
    if (!actx) actx = new AudioCtx();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, actx.currentTime);
    gain.gain.setValueAtTime(vol, actx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    osc.connect(gain);
    gain.connect(actx.destination);
    osc.start();
    osc.stop(actx.currentTime + dur);
}

function toggleSound() {
    soundOn = !soundOn;
    document.getElementById('soundBtn').innerText = soundOn ? '🔊' : '🔇';
    if (soundOn) playTone(520, 'triangle', 0.1);
}

let totalScore = parseInt(localStorage.getItem('arc_score') || '0');
document.getElementById('scoreVal').innerText = totalScore;
